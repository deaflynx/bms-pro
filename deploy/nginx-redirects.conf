# 301 redirects from the old WordPress URLs.
# The hosting's nginx template includes public_html/*.conf inside the server
# block, so scripts/deploy.sh ships this file as public_html/redirects.conf.
# nginx applies it only after a reload (HestiaCP reloads on any web-domain
# change in the panel); until then Astro's meta-refresh pages cover the same URLs.
location ~ ^/(services|shop|cart|checkout|my-account)/?$ { return 301 /products/; }
location ~ ^/contact/?$ { return 301 /contacts/; }
location ~ \.conf$ { return 404; }

# Some crawlers and audit tools probe the conventional path before reading
# robots.txt, which points at the index.
location = /sitemap.xml { return 301 /sitemap-index.xml; }

# Astro emits 404.html at the root; without this nginx serves its own default.
error_page 404 /404.html;
